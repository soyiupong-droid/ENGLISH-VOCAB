<style>

  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .toolbar button, .nav button {

  .toolbar button.active { background: var(--accent); }
  .toolbar button:active, .nav button:active, .opts button:active { transform: scale(0.98); }
  .qwrap {
    background: var(--card); border-radius: 14px; border: 1px solid #2a3548; padding: 18px 16px 14px;

  .qcode { color: var(--muted); font-size: 0.8rem; margin-bottom: 10px; }
  .hint-q { color: var(--muted); font-size: 0.9rem; text-align: center; margin-bottom: 4px; }
  .word {

    text-align: center; margin: 10px 0 16px; word-break: break-word;
  }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 8px; }
  .opts button {
    border: 0; border-radius: 12px; padding: 18px 12px;
    background: var(--btn); color: var(--text); font-size: 1.15rem; font-weight: 800;
    cursor: pointer; text-align: center;
  }
  .opts button.correct { background: var(--green); color: #052e16; }
  .opts button.wrong { background: var(--red); color: #fff; }
  .opts button:disabled { cursor: default; }
  .feedback { min-height: 28px; text-align: center; font-weight: 700; margin: 4px 0 10px; }
  .feedback.ok { color: var(--green); }
  .feedback.bad { color: var(--red); }
  .after {
    background: #0f172a; border-radius: 12px; padding: 14px; margin-top: 6px;
    border: 1px solid #334155; line-height: 1.55;
  }
  .after .pos { font-weight: 800; color: #86efac; margin-bottom: 8px; }
  .after .zh { font-size: 1.1rem; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; }
  .after .en { color: #94a3b8; font-size: 0.95rem; }
  .nav {
    display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap;
    position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%);
    padding: 16px 0 8px; margin-top: 8px;
  }
  .nav button.primary { background: var(--accent); flex: 1; min-width: 140px; }
  .nav button:disabled { opacity: 0.4; cursor: not-allowed; }
  .done { background: var(--card); border-radius: 14px; padding: 20px; border: 1px solid #2a3548; text-align: center; }
  .done h2 { margin: 0 0 8px; }
  .done p { color: var(--muted); }
  .hidden { display: none !important; }
</style>
</head>

word": "widely", "pos": ["adv"], "level": "B2", "levels": {"adv": "B2"}, "raw": "widely adv. B2", "meaning_en": "by a lot of people; in or to many places", "meaning_zh": "廣泛地", "ord": 2984}, {"id": "OX3K-P11-2985", "page": 11, "word": "youth", "pos": ["n"], "level": "B1", "levels": {"n": "B1"}, "raw": "youth n. B1", "meaning_en": "the time of life when a person is young, especially the time before a child becomes an adult", "meaning_zh": "青年；青春；年輕", "ord": 2985}, {"id": "OX3K-P11-2986", "page": 11, "word": "unless", "pos": ["conj"], "level": "B1", "levels": {"conj": "B1"}, "raw": "unless conj. B1", "meaning_en": "used to say that something can only happen or be true in a particular situation", "meaning_zh": "除非，如果不；除…之外", "ord": 2986}, {"id": "OX3K-P11-2987", "page": 11, "word": "vote", "pos": ["n", "v"], "level": "B1", "levels": {"n": "B1", "v": "B1"}, "raw": "vote n., v. B1", "meaning_en": "a formal choice that you make in an election or at a meeting in order to choose somebody or decide something", "meaning_zh": "投票，選舉；選票；得票數", "ord": 2987}, {"id": "OX3K-P11-2988", "page": 11, "word": "wife", "pos": ["n"], "level": "A1", "levels": {"n": "A1"}, "raw": "wife n. A1", "meaning_en": "the woman that somebody is married to; a married woman", "meaning_zh": "妻子，已婚婦女；夫人", "ord": 2988}, {"id": "OX3K-P11-2989", "page": 11, "word": "zero", "pos": ["number"], "level": "A2", "levels": {"number": "A2"}, "raw": "zero number A2", "meaning_en": "0", "meaning_zh": "零；零點，零度", "ord": 2989}, {"id": "OX3K-P11-2990", "page": 11, "word": "unlike", "pos": ["prep"], "level": "B1", "levels": {"prep": "B1"}, "raw": "unlike prep. B1", "meaning_en": "different from a particular person or thing", "meaning_zh": "和…不同，不像；不同的，不相似的", "ord": 2990}, {"id": "OX3K-P11-2991", "page": 11, "word": "wage", "pos": ["n"], "level": "B2", "levels": {"n": "B2"}, "raw": "wage n. B2", "meaning_en": "a regular amount of money that you earn, usually every week or every month, for work or services", "meaning_zh": "工資 <script>
(function () {
  const OPTIONS = ['adj', 'n', 'adv', 'v'];
  const POS_LABEL = { adj: 'adj 形容詞', n: 'n 名詞', adv: 'adv 副詞', v: 'v 動詞' };
  const ALLOWED = new Set(OPTIONS);
  const STORE_KEY = 'vocab-ox3k-all-pos4-wrongs';

  function pickCorrect(posList) {
    const hits = (posList || []).filter(p => ALLOWED.has(p));
    if (!hits.length) return null;
    return hits[Math.floor(Math.random() * hits.length)];
  }

  const ALL_RAW = (window.VOCAB_DATA || [])
    .filter(w => (w.pos || []).some(p => ALLOWED.has(p)))
    .map(w => ({
      id: w.id,
      word: w.word,
      page: w.page || 1,
      pos: (w.pos || []).filter(p => ALLOWED.has(p)),
      allPos: w.pos || [],
      level: w.level,
      meaning_en: w.meaning_en || '',
      meaning_zh: w.meaning_zh || '',
      raw: w.raw || ''
    }));
  let pageFrom = 1, pageTo = 11;
  function ALL() {
    return ALL_RAW.filter(w => w.page >= pageFrom && w.page <= pageTo);
  }

  let pool = [];
  let idx = 0;
  let answered = false;
  let correctCount = 0;
  let wrongIds = loadWrongs();
  let onlyWrong = false;
  let shuffleOn = true;
  let currentCorrect = null;

  function loadWrongs() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveWrongs() {
    localStorage.setItem(STORE_KEY, JSON.stringify(wrongIds));
  }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function rebuildPool() {
    const base = ALL();
    if (onlyWrong) {
      const set = new Set(wrongIds);
      pool = base.filter(x => set.has(x.id));
    } else {
      pool = base.slice();
    }
    if (shuffleOn) shuffle(pool);
    idx = 0; answered = false; currentCorrect = null;
  }
  function cur() { return pool[idx]; }
  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function render() {
    const doneEl = document.getElementById('done');
    const card = document.getElementById('card');
    if (!pool.length) {
      card.classList.add('hidden');
      doneEl.classList.remove('hidden');
      doneEl.innerHTML = onlyWrong
        ? '<h2>未有錯題</h2><p>答錯之後會記低，之後可以嚟重溫。</p>'
        : '<h2>冇題目</h2>';
      document.getElementById('counter').textContent = '0 / 0';
      document.getElementById('bar').style.width = '0%';
      return;
    }
    doneEl.classList.add('hidden');
    card.classList.remove('hidden');
    const item = cur();
    if (!answered) currentCorrect = pickCorrect(item.pos);
    const pct = answered ? ((idx + 1) / pool.length * 100) : (idx / pool.length * 100);
    document.getElementById('bar').style.width = pct + '%';
    document.getElementById('counter').textContent = (idx + 1) + ' / ' + pool.length;
    document.getElementById('score').textContent = '答對 ' + correctCount + ' · 錯題 ' + wrongIds.length;

    card.innerHTML = `
      <div class="qcode">${escapeHtml(item.id)} · CEFR ${escapeHtml(item.level || '—')}</div>
      <div class="hint-q">呢個字係咩詞性？</div>
      <div class="word">${escapeHtml(item.word)}</div>
      <div class="opts" id="opts"></div>
      <div class="feedback" id="fb"></div>
      <div id="after" class="after hidden"></div>
    `;
    const opts = document.getElementById('opts');
    OPTIONS.forEach(p => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = p;
      b.dataset.pos = p;
      b.onclick = () => onPick(p);
      opts.appendChild(b);
    });
    document.getElementById('btnPrev').disabled = idx <= 0;
    document.getElementById('btnNext').textContent = idx >= pool.length - 1 ? '完成' : '下一題';
  }

  function onPick(choice) {
    if (answered) return;
    answered = true;
    const item = cur();
    const correct = currentCorrect;
    const opts = document.getElementById('opts');
    [...opts.querySelectorAll('button')].forEach(btn => {
      btn.disabled = true;
      if (btn.dataset.pos === correct) btn.classList.add('correct');
    });
    const fb = document.getElementById('fb');
    const pickedBtn = [...opts.querySelectorAll('button')].find(b => b.dataset.pos === choice);
    if (choice === correct) {
      if (pickedBtn) pickedBtn.classList.add('correct');
      fb.textContent = '正確 ✓';
      fb.className = 'feedback ok';
      correctCount++;
      wrongIds = wrongIds.filter(id => id !== item.id);
    } else {
      if (pickedBtn) pickedBtn.classList.add('wrong');
      fb.textContent = '唔啱 — 正確已標綠';
      fb.className = 'feedback bad';
      if (!wrongIds.includes(item.id)) wrongIds.push(item.id);
    }
    saveWrongs();
    const after = document.getElementById('after');
    const allPosLabel = (item.pos || []).map(p => POS_LABEL[p] || p).join(' · ');
    after.innerHTML = `
      <div class="pos">正確：${escapeHtml(POS_LABEL[correct] || correct)}${(item.pos || []).length > 1 ? '（亦可：' + escapeHtml(allPosLabel) + '）' : ''}</div>
      <div class="zh">${escapeHtml(item.meaning_zh)}</div>
      <div class="en">${escapeHtml(item.meaning_en)}</div>
    `;
    after.classList.remove('hidden');
    document.getElementById('score').textContent = '答對 ' + correctCount + ' · 錯題 ' + wrongIds.length;
    document.getElementById('bar').style.width = ((idx + 1) / pool.length * 100) + '%';
  }

  function goNext() {
    if (idx >= pool.length - 1) {
      document.getElementById('card').classList.add('hidden');
      const d = document.getElementById('done');
      d.classList.remove('hidden');
      d.innerHTML = `<h2>完成！</h2><p>呢輪 ${pool.length} 個字 · 答對 ${correctCount} · 累積錯題 ${wrongIds.length}</p>
        <p style="margin-top:12px;"><button type="button" id="again" style="border:0;border-radius:10px;padding:12px 18px;background:var(--accent);color:#fff;font-weight:700;">再來一次</button></p>`;
      document.getElementById('again').onclick = () => { rebuildPool(); correctCount = 0; render(); };
      return;
    }
    idx++; answered = false; currentCorrect = null; render();
  }
  function goPrev() {
    if (idx <= 0) return;
    idx--; answered = false; currentCorrect = null; render();
  }

  document.getElementById('btnAll').onclick = () => {
    onlyWrong = false;
    document.getElementById('btnAll').classList.add('active');
    document.getElementById('btnWrong').classList.remove('active');
    rebuildPool(); correctCount = 0; render();
  };
  document.getElementById('btnWrong').onclick = () => {
    onlyWrong = true;
    document.getElementById('btnWrong').classList.add('active');
    document.getElementById('btnAll').classList.remove('active');
    rebuildPool(); correctCount = 0; render();
  };
  document.getElementById('btnRand').onclick = () => {
    shuffleOn = !shuffleOn;
    document.getElementById('btnRand').classList.toggle('active', shuffleOn);
    rebuildPool(); correctCount = 0; render();
  };
  document.getElementById('btnReset').onclick = () => {
    wrongIds = []; saveWrongs(); correctCount = 0;
    onlyWrong = false;
    document.getElementById('btnAll').classList.add('active');
    document.getElementById('btnWrong').classList.remove('active');
    rebuildPool(); render();
  };
  document.getElementById('btnNext').onclick = goNext;
  document.getElementById('btnPrev').onclick = goPrev;
  document.getElementById('btnPage').onclick = () => {
    const f = parseInt(document.getElementById('pageFrom').value, 10) || 1;
    const t = parseInt(document.getElementById('pageTo').value, 10) || 11;
    pageFrom = Math.max(1, Math.min(11, f));
    pageTo = Math.max(pageFrom, Math.min(11, t));
    document.getElementById('pageFrom').value = pageFrom;
    document.getElementById('pageTo').value = pageTo;
    rebuildPool(); correctCount = 0; render();
  };

  rebuildPool();
  render();
})();
</script>
</body>
</html>
